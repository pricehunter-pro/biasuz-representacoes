<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Catálogo e condições comerciais de representadas Biasuz">
<title>Representada • Biasuz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<style>
.brand-page{min-height:100vh;background:#111215;color:white}.brand-hero{padding:72px 7vw 48px;border-bottom:1px solid #292b30;display:grid;grid-template-columns:160px 1fr;gap:34px;align-items:center}.brand-identity{width:150px;height:150px;background:white;border-radius:24px;display:grid;place-items:center;padding:24px}.brand-identity img{max-width:100%;max-height:95px;object-fit:contain}.brand-hero h1{font-size:clamp(46px,7vw,92px);line-height:.95;letter-spacing:-.055em;margin:14px 0}.brand-hero p{max-width:760px;color:#aeb0b5;line-height:1.7}.commercial{padding:44px 7vw;border-bottom:1px solid #292b30}.commercial-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.condition{background:#191a1e;border:1px solid #292b30;border-radius:14px;padding:18px}.condition span{display:block;color:#8f9299;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.condition strong{display:block;margin-top:7px;font-size:18px}.promos{display:grid;gap:10px;margin-top:20px}.promo{background:#1b1c20;border-left:3px solid #f5c400;padding:16px;border-radius:10px}.catalog{padding:60px 7vw 90px}.catalog-toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:24px}.catalog-toolbar input{width:min(420px,100%);background:#191a1e;color:white;border:1px solid #34363a;border-radius:12px;padding:13px 15px;font:inherit}.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.product-card{background:#191a1e;border:1px solid #292b30;border-radius:16px;overflow:hidden}.product-card img{width:100%;aspect-ratio:1/1;object-fit:contain;background:white}.product-card .pc{padding:17px}.product-card h3{margin:0 0 8px;font-size:17px}.product-card p{color:#9b9da4;font-size:12px}.empty{padding:40px;border:1px dashed #34363a;border-radius:16px;color:#aaa}.back{display:inline-flex;margin:24px 7vw 0;color:#c7c8cc;font-size:13px}@media(max-width:1000px){.product-grid,.commercial-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.brand-hero{grid-template-columns:1fr}.brand-identity{width:110px;height:110px}.product-grid,.commercial-grid{grid-template-columns:1fr}.catalog-toolbar{align-items:stretch;flex-direction:column}}
</style>
</head>
<body class="brand-page">
<a class="back" href="./index.html">← Voltar para Biasuz</a>
<section class="brand-hero">
<div class="brand-identity"><img id="brandLogo" alt="" hidden></div>
<div><span class="eyebrow">Representada Biasuz</span><h1 id="brandName">Carregando...</h1><p id="brandDesc"></p><div class="hero-actions"><a id="officialLink" class="btn" target="_blank" rel="noopener">Site oficial</a><a id="whatsLink" class="btn btn-outline" target="_blank" rel="noopener">Falar com a Biasuz</a></div></div>
</section>

<section class="commercial">
<span class="eyebrow">Condições da representada</span><h2>Política comercial</h2>
<div id="policyGrid" class="commercial-grid"></div><p id="policyNotes" class="muted"></p>
<div id="promotionsWrap" hidden><h3>Promoções vigentes</h3><div id="promotions" class="promos"></div></div>
</section>

<section class="catalog">
<div class="catalog-toolbar"><div><span class="eyebrow">Catálogo</span><h2 id="catalogTitle">Produtos</h2></div><input id="productSearch" placeholder="Buscar produto, categoria ou SKU"></div>
<div id="productGrid" class="product-grid"></div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="./config.js"></script><script src="./brand.js"></script>
</body></html>
