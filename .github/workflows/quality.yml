name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate frontend structure and JavaScript
        run: node scripts/quality-check.mjs
